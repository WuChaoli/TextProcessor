[project]
name = "classification-service"
version = "0.1.0"
description = "受控的文本分类推理服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "scikit-learn==1.9.0",
    "sentence-transformers==5.6.1",
    "setfit==1.1.3",
    "torch==2.13.0",
    "transformers==4.49.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classification_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_integration: requires a mounted validated release and one RTX 3090 CUDA device",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
strict = true

[tool.ty.terminal]
error-on-warning = true
