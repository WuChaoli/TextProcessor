[project]
name = "datajuicer-service"
version = "0.1.0"
description = "受控的 Data-Juicer 异步处理服务"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=1.26.4,<2",
    "psycopg[binary]>=3.2,<4",
    "py-data-juicer==1.5.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "scipy>=1.16,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datajuicer_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor/data-juicer"]
markers = [
    "integration: requires PostgreSQL and Redis",
    "real_integration: requires external network access or live source services",
]

[tool.ruff]
target-version = "py311"
exclude = ["migrations", "vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
strict = true
exclude = ["migrations", "vendor"]

[tool.ty.terminal]
error-on-warning = true
