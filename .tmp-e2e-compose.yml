services:
  backend:
    ports:
      - "18000:8000"
    environment:
      EXTRACTION_INPUT_ROOTS: '["/e2e/input"]'
      EXTRACTION_OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__STAGING_ROOT: /e2e/staging
      EXTRACTION_WORKER__OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__PRODUCTION_FORMATS: '["pdf","xlsx"]'
      EXTRACTION_WORKER__MINERU_BASE_URL: http://host.docker.internal:8001
      EXTRACTION_WORKER__DOCLING_BASE_URL: http://docling-api:5001
      EXTRACTION_WORKER__DOCLING_API_KEY: ${DOCLING_SERVE_API_KEY}
    volumes:
      - ./assets:/e2e/input:ro
      - ./.tmp-e2e-output:/e2e/output

  extraction-worker:
    environment:
      EXTRACTION_INPUT_ROOTS: '["/e2e/input"]'
      EXTRACTION_OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__STAGING_ROOT: /e2e/staging
      EXTRACTION_WORKER__OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__PRODUCTION_FORMATS: '["pdf","xlsx"]'
      EXTRACTION_WORKER__MINERU_BASE_URL: http://host.docker.internal:8001
      EXTRACTION_WORKER__DOCLING_BASE_URL: http://docling-api:5001
      EXTRACTION_WORKER__DOCLING_API_KEY: ${DOCLING_SERVE_API_KEY}
    volumes:
      - ./assets:/e2e/input:ro
      - ./.tmp-e2e-output:/e2e/output

  extraction-beat:
    environment:
      EXTRACTION_INPUT_ROOTS: '["/e2e/input"]'
      EXTRACTION_OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__STAGING_ROOT: /e2e/staging
      EXTRACTION_WORKER__OUTPUT_ROOTS: '["/e2e/output"]'
      EXTRACTION_WORKER__PRODUCTION_FORMATS: '["pdf","xlsx"]'
      EXTRACTION_WORKER__MINERU_BASE_URL: http://host.docker.internal:8001
      EXTRACTION_WORKER__DOCLING_BASE_URL: http://docling-api:5001
      EXTRACTION_WORKER__DOCLING_API_KEY: ${DOCLING_SERVE_API_KEY}

