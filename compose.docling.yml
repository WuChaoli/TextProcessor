services:
  docling:
    image: '${DOCKER_IMAGE_DOCLING-docling-service}:${TAG-latest}'
    restart: always
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/docling_service/Dockerfile
      args:
        DOCLING_BASE_IMAGE: ${DOCLING_BASE_IMAGE?Variable not set}
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY?Variable not set}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_ENG_KIND: rq
      DOCLING_SERVE_ENG_RQ_REDIS_URL: redis://redis:6379/1
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_MAX_FILE_SIZE: ${DOCLING_MAX_FILE_SIZE_BYTES:-104857600}
      DOCLING_SERVE_MAX_NUM_PAGES: ${DOCLING_MAX_NUM_PAGES:-500}
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_MAX_DOCUMENT_TIMEOUT_SECONDS:-3600}
      DOCLING_SERVE_MAX_SOURCES_PER_REQUEST: "1"
      DOCLING_SERVE_SINGLE_USE_RESULTS: "false"
      DOCLING_PROCESS_STATE_PATH: /run/textprocessor-docling/processes.json
    healthcheck:
      test: ["CMD", "python", "/opt/textprocessor-docling/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - docling-model-cache:/opt/app-root/src/.cache

volumes:
  docling-model-cache:
