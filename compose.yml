services:

  classification:
    image: '${DOCKER_IMAGE_CLASSIFICATION-classification-service}:${TAG-latest}'
    restart: always
    build:
      context: .
      dockerfile: services/classification_service/Dockerfile
    environment:
      - CLASSIFICATION_ENVIRONMENT=${CLASSIFICATION_ENVIRONMENT-development}
      - CLASSIFICATION_INTERNAL_SERVICE_TOKEN=${CLASSIFICATION_INTERNAL_SERVICE_TOKEN?Variable not set}
      - CLASSIFICATION_MODEL_ROOT=/models/releases
      - CLASSIFICATION_MODEL_RELEASE=/models/releases/${CLASSIFICATION_MODEL_RELEASE?Variable not set}
      - CLASSIFICATION_MODEL_RELEASE_SHA256=${CLASSIFICATION_MODEL_RELEASE_SHA256?Variable not set}
      - CLASSIFICATION_RELEASE_QUALITY_STATUS=${CLASSIFICATION_RELEASE_QUALITY_STATUS-experimental}
      - CLASSIFICATION_INPUT_ROOT=/data/textprocessor/classification
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - NVIDIA_VISIBLE_DEVICES=${CLASSIFICATION_NVIDIA_VISIBLE_DEVICES-0}
    volumes:
      - ${CLASSIFICATION_MODEL_ROOT?Variable not set}:/models/releases:ro
      - classification-staging:/data/textprocessor/classification:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  datajuicer:
    image: '${DOCKER_IMAGE_DATAJUICER-datajuicer-service}:${TAG-latest}'
    restart: always
    build:
      context: .
      dockerfile: services/datajuicer_service/Dockerfile
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    environment:
      - DATAJUICER_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER?Variable not set}:${POSTGRES_PASSWORD?Variable not set}@db:5432/${POSTGRES_DB}
      - DATAJUICER_CELERY_BROKER_URL=redis://redis:6379/2
      - DATAJUICER_CELERY_QUEUE=datajuicer.jobs
      - DATAJUICER_WORKER_CONCURRENCY=1
    volumes:
      - datajuicer-work:/data/textprocessor/global-deduplication
    healthcheck:
      test: ["CMD", "python", "-m", "datajuicer_service.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s
    volumes:
      - textprocessor-redis-data:/data

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    profiles: [debug]
    image: adminer
    restart: always
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  backend-api:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - EXTRACTION_WORKER__DOCLING_BASE_URL=${EXTRACTION_DOCLING_BASE_URL-http://docling:5001}
      - EXTRACTION_WORKER__DOCLING_API_KEY=${EXTRACTION_DOCLING_API_KEY-}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - processor-input:/data/textprocessor/input
      - processor-output:/data/textprocessor/output

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  task-runner:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command:
      - python
      - -m
      - app.task_runner.process_manager
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - EXTRACTION_WORKER__DOCLING_BASE_URL=${EXTRACTION_DOCLING_BASE_URL-http://docling:5001}
      - EXTRACTION_WORKER__DOCLING_API_KEY=${EXTRACTION_DOCLING_API_KEY-}
      - GLOBAL_DEDUP_WORKER__DATAJUICER_BASE_URL=http://datajuicer:8000
      - CLASSIFICATION_BASE_URL=http://classification:8000
      - CLASSIFICATION_API_TOKEN=${CLASSIFICATION_INTERNAL_SERVICE_TOKEN?Variable not set}
      - CLASSIFICATION_STAGING_ROOT=/data/textprocessor/classification
    volumes:
      - celery-beat-data:/var/lib/celery
      - classification-staging:/data/textprocessor/classification
      - datajuicer-work:/data/textprocessor/global-deduplication
      - processor-input:/data/textprocessor/input
      - processor-output:/data/textprocessor/output
    healthcheck:
      test: ["CMD", "python", "-m", "app.task_runner.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:
  celery-beat-data:
  classification-staging:
  datajuicer-work:
  processor-input:
  processor-output:
  textprocessor-redis-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
